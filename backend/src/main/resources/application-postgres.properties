# PostgreSQL Database (production / Render profile)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/transynq}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:transynq}
spring.datasource.password=${DB_PASSWORD:transynq}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Production Security & CORS
spring.h2.console.enabled=false
server.forward-headers-strategy=native
server.error.include-stacktrace=never
server.error.include-message=never
transynq.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app,http://localhost:5173}
transynq.security.scenario-api-key=${SCENARIO_API_KEY:}
