spring.application.name=transynq
server.port=8080

# H2 In-Memory Database (development/testing profile)
spring.datasource.url=jdbc:h2:mem:transynq;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Security & CORS configuration
transynq.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app}
transynq.security.scenario-api-key=${SCENARIO_API_KEY:}
server.forward-headers-strategy=native
server.error.include-stacktrace=never
server.error.include-message=never
